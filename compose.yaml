services:
  deno:
    build: .
    restart: always
    ports:
      - ${PORT:-8000}:8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}

  db:
    image: postgres:18
    restart: always
    ports:
      - 127.0.0.1:${PGPORT:-5432}:5432
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U \"$${PGUSER}\" -d \"$${PGDATABASE}\"",
      ]
      interval: 5s
      timeout: 5s
      retries: 10
    # set shared memory limit when using docker compose
    #shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_DB: ${PGDATABASE}

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
